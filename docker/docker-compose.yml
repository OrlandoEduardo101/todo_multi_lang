services:
  postgres:
    image: postgres:15
    container_name: todo_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-todo_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../backend/todo_dart_vaden
      dockerfile: Dockerfile
    container_name: todo_vaden_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-todo_db}
      JWT_SECRET: shared-dev-jwt-secret-32-characters-minimum-123456
      JWT_EXPIRATION_HOURS: ${JWT_EXPIRATION_HOURS:-72}
    ports:
      - "8080:8080"
    volumes:
      - ../backend/todo_dart_vaden/vaden_data:/app/vaden_data
    command: ["./server"]

  todo_java:
    build:
      context: ../backend/todo_java_spring
      dockerfile: Dockerfile
    container_name: todo_java
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-todo_db}
      JWT_SECRET: shared-dev-jwt-secret-32-characters-minimum-123456
      JWT_EXPIRATION: ${JWT_EXPIRATION:-259200}
    ports:
      - "8081:8080"

  todo_go:
    build:
      context: ../backend/todo_go_fiber
      dockerfile: Dockerfile
    container_name: todo_go
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DB_NAME: ${POSTGRES_DB:-todo_db}
      JWT_SECRET: shared-dev-jwt-secret-32-characters-minimum-123456
    ports:
      - "3000:3000"
    working_dir: /app

  # todo_java:
  #   build:
  #     context: ../backend/todo_java_spring
  #   container_name: todo_java
  #   restart: always
  #   depends_on:
  #     - postgres
  #   ports:
  #     - "8080:8080"
  #   env_file:
  #     - ../backend/.env
  #   volumes:
  #     - ../backend/.env:/app/.env
  #   working_dir: /app

volumes:
  pgdata:
  vaden_data:
