spring.application.name=todo

# Porta do backend Java
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
# jwt.secret: Chave secreta para assinar tokens (mínimo 32 caracteres)
# jwt.expiration: Tempo de expiração em SEGUNDOS (padrão: 259200 = 3 dias)
#
# ⚠️ IMPORTANTE: Em produção, use variáveis de ambiente!
# export JWT_SECRET="sua-chave-super-secreta-com-minimo-32-caracteres-aleatorios"
# export JWT_EXPIRATION=259200
#
# Por padrão em desenvolvimento:
jwt.secret=${JWT_SECRET:dev-secret-key-que-deve-ser-alterado-em-producao-com-32-caracteres}
jwt.expiration=${JWT_EXPIRATION:259200}

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
